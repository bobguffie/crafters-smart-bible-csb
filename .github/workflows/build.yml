name: Build Cross-Platform Apps (Desktop & Mobile)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Desktop Builds: Windows (.exe), macOS (.dmg), Linux (.AppImage)
  # -------------------------------------------------------------
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows'
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev libjavascriptcoregtk-4.0-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install project dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Build Desktop Application (Tauri CLI)
        run: npx tauri build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CSB-${{ matrix.name }}-Desktop
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.AppImage
            src-tauri/target/release/*.dmg
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 2. Android Build: Package (.apk)
  # -------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web assets
        run: npm run build

      - name: Capacitor Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CSB-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 3. iOS Build: Unsigned iOS Xcode project folder
  # -------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web assets
        run: npm run build

      - name: Capacitor Sync iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Prepare Unsigned iOS Xcode Folder
        run: |
          mkdir -p build/ios-unsigned
          if [ -d "ios" ]; then
            cp -R ios/* build/ios-unsigned/
          fi

      - name: Upload Unsigned iOS Folder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSB-iOS-Unsigned-Xcode-Project
          path: build/ios-unsigned/
          if-no-files-found: warn
