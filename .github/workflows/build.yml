name: Build Cross-Platform Apps (Desktop & Mobile)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Desktop Builds: Windows (.exe), macOS (.dmg), Linux (.AppImage)
  # -------------------------------------------------------------
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows'
          - platform: 'macos-latest'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            name: 'Linux'

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libsoup2.4-dev libjavascriptcoregtk-4.0-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install project dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Build Desktop Application (Tauri CLI)
        run: npx tauri build --ci --verbose --no-sign

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CSB-${{ matrix.name }}-Desktop
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.AppImage
            src-tauri/target/release/*.dmg
            src-tauri/target/release/crafters-smart-bible*
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 2. Android Build: Package (.apk)
  # -------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Capacitor Sync Android
        run: |
          npx cap add android || true
          npx cap sync android || npx cap copy android

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CSB-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # -------------------------------------------------------------
  # 3. iOS Build: Native iOS Xcode project
  # -------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Capacitor Setup iOS
        run: |
          npx cap add ios || true
          npx cap copy ios || true
          mkdir -p ios
          echo "Open App.xcodeproj in Xcode on macOS to build and sign for iOS device or simulator." > ios/README.txt
          tar -czf CSB-iOS-Xcode-Project.tar.gz ios/

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSB-iOS-Xcode-Project
          path: CSB-iOS-Xcode-Project.tar.gz
          if-no-files-found: warn
