[package]
name = "crafters-smart-bible"
version = "1.0.0"
description = "Crafters Smart Bible (CSB) Desktop Application"
authors = ["Crafters Smart Bible Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "notification-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
